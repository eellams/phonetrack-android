name: Release

# A v* tag publishes a release (vX.Y.Z = full release, vX.Y.Z-suffix = pre-release).
# Run manually for a dry run: everything is built and checked, and the would-be release
# (notes, APKs, checksums) is uploaded as a workflow artifact instead. See RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APKs and publish release (dry run unless tagged)
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # all tags: the version code is compared with the previous release's
          fetch-depth: 0

      - name: Install git-cliff
        # generates the release notes from the commit messages (cliff.toml)
        run: pipx install git-cliff==2.14.2

      - name: Check version and write release notes
        id: meta
        # a dry run checks the release of the version in gradle.properties
        run: scripts/release/prepare.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}" release-out

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # 17 runs Gradle (last listed = JAVA_HOME); 21 is the javac and unit-test
      # toolchain (app/build.gradle.kts), found through JAVA_HOME_21_X64
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set; release APKs will be debug-signed."
          fi

      - name: Run unit tests
        # AGP 9 only wires up unit test tasks for the Debug build type (its
        # testBuildType default) across all flavors - there's no
        # testNormalReleaseUnitTest task any more. Same test source, so
        # testing the normal flavor's Debug variant is an equivalent check.
        run: ./gradlew -Pci --console=plain :app:testNormalDebugUnitTest

      - name: Assemble release APKs
        run: ./gradlew -Pci --console=plain assembleNormalRelease assemblePlayRelease

      - name: Collect APKs
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for flavor in normal play; do
            cp "app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" \
              "release-out/phonetrack-$VERSION-$flavor.apk"
            # R8 mapping files, to turn obfuscated stack traces back into readable ones
            # (retrace phonetrack-<version>-<flavor>-mapping.txt trace.txt)
            cp "app/build/outputs/mapping/${flavor}Release/mapping.txt" \
              "release-out/phonetrack-$VERSION-$flavor-mapping.txt"
          done
          (cd release-out && sha256sum phonetrack-*.apk phonetrack-*-mapping.txt > SHA256SUMS.txt)
          cat release-out/SHA256SUMS.txt

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: PhoneTrack ${{ steps.meta.outputs.version }}
          # highlights (optional) + notes generated from the commit messages
          body_path: release-out/RELEASE_NOTES.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            release-out/phonetrack-*.apk
            release-out/phonetrack-*-mapping.txt
            release-out/SHA256SUMS.txt

      - name: Add the release to CHANGELOG.md on main
        if: github.ref_type == 'tag' && steps.meta.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git fetch origin main
          git switch --detach origin/main
          scripts/release/update-changelog.sh release-out/CHANGELOG_ENTRY.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already has $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs(changelog): $VERSION"
          git push origin HEAD:main

      - name: Upload dry-run release
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-${{ steps.meta.outputs.version }}
          path: release-out/
          if-no-files-found: error
